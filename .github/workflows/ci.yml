name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: HTML link checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lychee — internal links only (fail on internal breakage)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --no-external .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lychee — external links (report-only; excludes unpkg CDN)
        uses: lycheeverse/lychee-action@v1
        continue-on-error: true
        with:
          args: --no-progress --verbose --include-fragments --max-retries 2 --timeout 20s --exclude "https://unpkg.com/.*" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: HTML validation (report-only)
        continue-on-error: true
        run: |
          npx --yes html-validate "**/*.html"
